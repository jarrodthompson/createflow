# Optional local services for CreateFlow (Phases 3, 5, 7).
# Docker is NOT required — you can use hosted alternatives instead:
#   Redis   -> Upstash        Storage -> Cloudflare R2 / AWS S3
#   Postgres-> Neon / Supabase
#
# Start everything:  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: createflow
      POSTGRES_PASSWORD: createflow
      POSTGRES_DB: createflow
    ports:
      - "5432:5432"
    volumes:
      - cf_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible object storage
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: createflow
      MINIO_ROOT_PASSWORD: createflow123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cf_minio:/data

volumes:
  cf_pg:
  cf_minio:
