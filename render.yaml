# Render Blueprint — free, single-service deploy of CreateFlow.
# Inline queue (generation runs in the web process — no separate worker/Redis),
# Supabase for Postgres + S3-compatible Storage, Cloudflare AI.
# Deploy: Render → New → Blueprint → pick this repo. `sync: false` = set in dashboard.
services:
  - type: web
    name: createflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /sign-in
    dockerCommand: sh scripts/start.sh
    envVars:
      - key: QUEUE_DRIVER
        value: inline
      - key: STORAGE_DRIVER
        value: s3
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: S3_BUCKET
        value: createflow
      - key: AI_TEXT_PROVIDER
        value: cloudflare
      - key: AI_IMAGE_PROVIDER
        value: cloudflare
      - key: AI_VISION_PROVIDER
        value: cloudflare
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENC_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      # Etsy (optional) — set these to create REAL draft listings instead of the
      # dev mock. ETSY_CLIENT_ID = keystring, ETSY_CLIENT_SECRET = shared secret,
      # ETSY_REDIRECT_URI = <APP_URL>/api/etsy/oauth/callback (register it in the
      # Etsy app too). Leave unset to keep the safe mock draft flow.
      - key: ETSY_CLIENT_ID
        sync: false
      - key: ETSY_CLIENT_SECRET
        sync: false
      - key: ETSY_REDIRECT_URI
        sync: false
